# DROP CI: tests, build and security gates on every push and pull request.
# A pull request cannot be merged while any job fails (turn on branch protection for main and
# mark these checks as required: Settings → Branches → main → Require status checks).
name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Tests and build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            backend/package-lock.json
            frontend/package-lock.json
      - name: Install (lockfiles only, no install scripts from the network)
        run: |
          npm ci --prefix backend
          npm ci --prefix frontend
      - name: Backend tests (API, security, money, comms, tracking)
        run: npm test --prefix backend
      - name: Frontend type-check and build
        run: npm run build --prefix frontend

  scale:
    name: PostgreSQL + Redis, multi-server races
    runs-on: ubuntu-latest
    timeout-minutes: 25
    services:
      postgres:
        image: postgres:16
        env: { POSTGRES_USER: drop, POSTGRES_PASSWORD: ci-only-password, POSTGRES_DB: postgres }
        ports: ['5432:5432']
        options: --health-cmd "pg_isready -U drop" --health-interval 5s --health-retries 20
      redis:
        image: redis:7
        ports: ['6379:6379']
        options: --health-cmd "redis-cli ping" --health-interval 5s --health-retries 20
    env:
      PGHOST: localhost
      PGPORT: '5432'
      PGUSER: drop
      PGPASSWORD: ci-only-password
      REDIS_URL: redis://localhost:6379
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - run: sudo apt-get update -qq && sudo apt-get install -y -qq postgresql-client redis-tools
      - run: npm ci --prefix backend
      - name: Whole API suite on PostgreSQL + Redis
        working-directory: backend
        run: scripts/test-postgres.sh || (tail -50 /tmp/pgtest-*.log; exit 1)
      - name: Races across 2 servers (last seat, idempotency, one trip per passenger/driver)
        working-directory: backend
        run: |
          psql -d postgres -qc "create database drop_scale"
          redis-cli -u "$REDIS_URL" flushall
          SCALE_DATABASE_URL="postgresql://drop:ci-only-password@localhost:5432/drop_scale" SCALE_REDIS_URL="$REDIS_URL" node --test --test-timeout=300000 test/scale/concurrency.test.js

  mobile:
    name: Mobile apps (type-check, unit tests, bundle)
    runs-on: ubuntu-latest
    timeout-minutes: 25
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: mobile/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm test -- --ci
      - name: Bundle both apps (Android + iOS, Hermes)
        env:
          CI: '1'
        run: |
          for app in passenger driver; do
            (cd apps/$app && npx expo export --platform android --output-dir /tmp/$app-android && npx expo export --platform ios --output-dir /tmp/$app-ios)
          done

  dependencies:
    name: Dependency vulnerabilities
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: npm audit (fail on high or critical)
        run: |
          npm audit --prefix backend --omit=dev --audit-level=high
          npm audit --prefix frontend --audit-level=high
          npm audit --prefix mobile --omit=dev --audit-level=high
      - name: OSV-Scanner
        uses: google/osv-scanner-action/osv-scanner-action@v2.0.2
        with:
          scan-args: |-
            --config=osv-scanner.toml
            --lockfile=backend/package-lock.json
            --lockfile=frontend/package-lock.json
            --lockfile=mobile/package-lock.json

  secrets:
    name: Secret scanning
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # scan the full history, not just the latest commit
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  sast:
    name: Static analysis (Semgrep)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    container:
      image: semgrep/semgrep
    steps:
      - uses: actions/checkout@v7
      - name: Semgrep (OWASP Top 10, Node, Express, React, secrets)
        run: semgrep scan --error --severity ERROR --config p/owasp-top-ten --config p/nodejs --config p/expressjs --config p/react --config p/secrets --config .semgrep.yml --exclude 'backend/test' --exclude 'brand'

  codeql:
    name: CodeQL
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      security-events: write
      contents: read
    steps:
      - uses: actions/checkout@v7
      - uses: github/codeql-action/init@v3
        with:
          languages: javascript-typescript
          queries: security-extended
      - uses: github/codeql-action/analyze@v3
